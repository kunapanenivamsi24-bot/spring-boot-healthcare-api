server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:healthdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    # DEMO-ONLY secret. Replace with a strong, externally supplied secret
    # (e.g. an environment variable) before any real deployment.
    # Must be at least 32 characters for HS256.
    secret: demo-only-secret-key-for-healthcare-api-change-in-production-123456
    expiration: 3600000

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/healthdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false
